<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Flow | Authentication</title>
    <link rel="stylesheet" href="auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <button id="lang-btn" class="lang-btn" type="button">TH / EN</button>

    <div class="auth-card">
        <h1 id="auth-title">ยินดีต้อนรับกลับมา</h1>
        <p id="auth-subtitle">เข้าสู่ระบบด้วยบัญชี Urban Flow</p>

        <div id="auth-status" class="auth-status hidden" role="status"></div>

        <form id="auth-form">
            <div id="register-fields" class="hidden">
                <div class="input-group">
                    <label for="display-name" data-en="Display Name" data-th="ชื่อแสดงผล">ชื่อแสดงผล</label>
                    <input type="text" id="display-name" maxlength="100" autocomplete="name" placeholder="Urban Flow User">
                </div>
            </div>

            <div class="input-group">
                <label for="email" data-en="Email Address" data-th="อีเมล">อีเมล</label>
                <input type="email" id="email" placeholder="name@example.com" autocomplete="email" required>
            </div>

            <div class="input-group">
                <label for="password" data-en="Password" data-th="รหัสผ่าน">รหัสผ่าน</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" minlength="6" required>
            </div>


            <div id="register-password-confirm" class="register-only hidden">
                <div class="input-group">
                    <label for="confirm-password" data-en="Confirm Password" data-th="ยืนยันรหัสผ่าน">ยืนยันรหัสผ่าน</label>
                    <input type="password" id="confirm-password" placeholder="••••••••" autocomplete="new-password" minlength="6">
                </div>
            </div>

            <button type="submit" class="auth-btn" id="submit-btn">เข้าสู่ระบบ</button>
        </form>

        <div class="auth-footer">
            <p><a href="#" id="toggle-auth">ยังไม่มีบัญชี? สร้างบัญชีใหม่</a></p>
        </div>
    </div>

    <script type="module" src="src/auth.js"></script>
</body>
</html>
